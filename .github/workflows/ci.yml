name: autofix.ci

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: pj-hoakari/actions/detect-changes@e0ffe48f766307783a545c33bc29d58362094572 # v20261113.0.0
        with:
          paths: |
            src/
            messages/
            public/
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .npmrc
            tsconfig.json
            global.d.ts
            next.config.ts
            postcss.config.mjs
            components.json
            biome.json
            .github/workflows/ci.yml

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.changes.outputs.changed == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com/

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        if: steps.changes.outputs.changed == 'true'
        run: pnpm typecheck

      - name: Autofix linting issues
        if: steps.changes.outputs.changed == 'true'
        run: pnpm check:fix

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        if: steps.changes.outputs.changed == 'true'
        with:
          commit-message: "style: Format"

  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --user 1001
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: pj-hoakari/actions/detect-changes@e0ffe48f766307783a545c33bc29d58362094572 # v20261113.0.0
        with:
          paths: |
            src/
            messages/
            public/
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .npmrc
            tsconfig.json
            global.d.ts
            next.config.ts
            postcss.config.mjs
            components.json
            vitest.config.mts
            vitest.shims.d.ts
            .storybook/
            .github/workflows/ci.yml

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.changes.outputs.changed == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com/

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        if: steps.changes.outputs.changed == 'true'
        run: pnpm test:all
