services:
  web:
    environment:
      TUNNEL_SUBDOMAIN: ${TUNNEL_SUBDOMAIN:-test}

  tunnel-proxy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    environment:
      TUNNEL_SUBDOMAIN: ${TUNNEL_SUBDOMAIN:-test}
    volumes:
      - type: bind
        source: ./tunnel/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
    depends_on:
      - web
      - firebase-emulator

  tunnel:
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    command: tunnel --protocol http2 --url http://tunnel-proxy:8080 --allowed-mail ${TUNNEL_ALLOWED_MAIL:?set TUNNEL_ALLOWED_MAIL}
    depends_on:
      - tunnel-proxy
