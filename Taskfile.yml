# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  TUNNEL_COMPOSE: docker compose -f compose.yaml -f compose.tunnel.yaml

tasks:
  release:
    desc: Create a GitHub release after checking that VERSION is newer than every existing tag.
    requires:
      vars: [VERSION]
    silent: true
    cmds:
      - |
        set -euo pipefail

        TAG="{{.VERSION}}"
        SEMVER='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
        if ! printf '%s' "${TAG#v}" | grep -Eq "$SEMVER" || [ "${TAG:0:1}" != "v" ]; then
          echo "usage: task release VERSION=vX.Y.Z（または vX.Y.Z-suffix）。指定値: '${TAG}'" >&2
          exit 1
        fi

        if [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
          echo "タグ ${TAG} は既にあります" >&2
          exit 1
        fi

        VERSION="${TAG#v}"
        LATEST="$(git ls-remote --tags --refs origin 'refs/tags/v*' \
          | sed 's|.*refs/tags/v||' | grep -E "$SEMVER" \
          | sed 's/-/~/' | sort -V | tail -n 1 | sed 's/~/-/' || true)"
        if [ -n "$LATEST" ]; then
          HIGHEST="$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sed 's/-/~/' | sort -V | tail -n 1 | sed 's/~/-/')"
          if [ "$HIGHEST" != "$VERSION" ]; then
            echo "${TAG} は最新のバージョン v${LATEST} より新しくありません" >&2
            exit 1
          fi
        fi

        ARGS=(--title "$TAG" --generate-notes)
        case "$VERSION" in
          *-*) ARGS+=(--prerelease) ;;
        esac

        echo "release ${TAG}（現在の最新: ${LATEST:+v}${LATEST:-なし}）"
        if [ "${DRY_RUN:-}" = "1" ]; then
          exit 0
        fi
        gh release create "$TAG" "${ARGS[@]}"

  tunnel:
    desc: Quick Tunnel で開発環境を公開し、URL を表示する
    cmds:
      - '{{.TUNNEL_COMPOSE}} up -d --build'
      - task: tunnel:url

  tunnel:stop:
    desc: Quick Tunnel を止めて公開を終える
    cmds:
      - '{{.TUNNEL_COMPOSE}} stop tunnel tunnel-proxy'

  tunnel:url:
    desc: Quick Tunnel の URL を表示する
    silent: true
    cmds:
      - |
        container=$({{.TUNNEL_COMPOSE}} ps -q tunnel)
        if [ -z "$container" ]; then
          echo "Quick Tunnel が起動していません。task tunnel で起動してください。" >&2
          exit 1
        fi
        started=$(docker inspect --format '{{"{{.State.StartedAt}}"}}' "$container")
        for _ in $(seq 1 30); do
          url=$({{.TUNNEL_COMPOSE}} logs --no-log-prefix --since "$started" tunnel 2>/dev/null | awk '
            match($0, /https:\/\/[a-z0-9-]+\.trycloudflare\.com/) { url = substr($0, RSTART, RLENGTH); registered = 0 }
            /Registered tunnel connection/ { registered = 1 }
            END { if (registered) print url }
          ')
          if [ -n "$url" ]; then
            echo "$url"
            exit 0
          fi
          sleep 2
        done
        echo "Quick Tunnel の接続を確認できませんでした。{{.TUNNEL_COMPOSE}} logs tunnel を確認してください。" >&2
        exit 1
