services:
  firebase-emulator:
    build:
      context: ./firebase-emulator
    image: tolo-firebase-emulator
    ports:
      - "8080:8080" # Firestore
      - "9099:9099" # Auth
      - "4000:4000" # Emulator UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 2s
      timeout: 2s
      retries: 60

  fakeidp:
    build:
      context: https://github.com/pj-hoakari/tolo-service-gateway.git#a61f55d8f1124a09839711cbc7d960ddf59f9456
      target: fakeidp
    environment:
      SERVER_ADDR: :8080
      FAKE_IDP_ISSUER: http://fakeidp:8080
      FAKE_IDP_AUDIENCE: backend-api
    ports:
      - "8082:8080"

  tolo-edge-bridge:
    image: ghcr.io/pj-hoakari/tolo-edge-bridge:0.5.0-rc@sha256:4f39d0c9ebed35c26876b25881995979e3c1a8ae44a214e1801722e2151128ff
    ports:
      - "8787:8787"
    environment:
      SERVER_ADDR: ":8787"
      FIRESTORE_PROJECT_ID: demo-tolo
      FIRESTORE_EMULATOR_HOST: firebase-emulator:8080
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
      IDP_ISSUER: http://fakeidp:8080
      IDP_AUDIENCE: backend-api
      IDP_JWKS_URL: http://fakeidp:8080/oauth2/jwks
      CONSOLE_CLIENT_ID: console-ui
      EDGE_CLIENT_ID: edge-page
    depends_on:
      firebase-emulator:
        condition: service_healthy
      fakeidp:
        condition: service_started

  web:
    build:
      context: .
      target: dev
      secrets:
        - npm_token
    image: tolo-web-dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      FIREBASE_PROJECT_ID: demo-tolo
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      SIGNALING_URL: http://tolo-edge-bridge:8787
      GRAPH_ACCESS_TOKEN: ${GRAPH_ACCESS_TOKEN:-}
      OBSERVATION_ACCESS_TOKEN: ${OBSERVATION_ACCESS_TOKEN:-}
      OBSERVATION_API_MOCKING: ${OBSERVATION_API_MOCKING:-enabled}
      TENANT_SUBDOMAIN_MOCKING: ${TENANT_SUBDOMAIN_MOCKING:-enabled}
      TENANT_ACCESS_TOKEN: ${TENANT_ACCESS_TOKEN:-}
      FAKEIDP_URL: http://fakeidp:8080
    depends_on:
      - firebase-emulator
      - tolo-edge-bridge
    volumes:
      - type: bind
        source: ./public/models
        target: /app/public/models
        read_only: true
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
            - .git/
            - .env
            - public/models/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml

  e2e:
    build:
      context: .
      target: e2e
      secrets:
        - npm_token
    image: tolo-web-e2e
    profiles:
      - e2e
    volumes:
      - type: bind
        source: ./test-results
        target: /app/test-results

secrets:
  npm_token:
    environment: NPM_TOKEN
