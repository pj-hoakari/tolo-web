services:
    firebase-emulator:
        build:
            context: ./firebase-emulator
        image: tolo-firebase-emulator
        ports:
            - "8080:8080" # Firestore
            - "4000:4000" # Emulator UI

    tolo-edge-bridge:
        image: ghcr.io/pj-hoakari/tolo-edge-bridge:0.1.0-rc@sha256:6a402d7fe9243aa7768ba7a7cbdd0606d14a4fea01b2bb6ec8314d3f82950cb1
        ports:
            - "8787:8787"
        environment:
            SERVER_ADDR: ":8787"
            FIRESTORE_PROJECT_ID: demo-tolo
            FIRESTORE_EMULATOR_HOST: firebase-emulator:8080
        depends_on:
            - firebase-emulator

    web:
        build:
            context: .
            target: dev
            secrets:
                - npm_token
        image: tolo-web-dev
        ports:
            - "3000:3000"
        environment:
            NODE_ENV: development
            NEXT_TELEMETRY_DISABLED: "1"
            WATCHPACK_POLLING: "true"
            NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-tolo
            NEXT_PUBLIC_FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
            SIGNALING_URL: http://tolo-edge-bridge:8787
        depends_on:
            - firebase-emulator
            - tolo-edge-bridge
        volumes:
            - type: bind
              source: ./public/models
              target: /app/public/models
              read_only: true
        develop:
            watch:
                - action: sync
                  path: .
                  target: /app
                  ignore:
                      - node_modules/
                      - .next/
                      - .git/
                      - .env
                      - public/models/
                - action: rebuild
                  path: package.json
                - action: rebuild
                  path: pnpm-lock.yaml

    e2e:
        build:
            context: .
            target: e2e
            secrets:
                - npm_token
        image: tolo-web-e2e
        profiles:
            - e2e
        volumes:
            - type: bind
              source: ./test-results
              target: /app/test-results

secrets:
    npm_token:
        environment: NPM_TOKEN
