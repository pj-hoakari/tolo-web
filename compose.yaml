services:
    firebase:
        image: node:24-slim
        working_dir: /app
        command: >
            sh -c "corepack enable &&
            npx -y firebase-tools@latest emulators:start
            --only firestore
            --project $${FIRESTORE_PROJECT_ID:-tolo-signaling}"
        ports:
            - "4000:4000"
            - "8080:8080"
        environment:
            FIRESTORE_PROJECT_ID: ${FIRESTORE_PROJECT_ID:-tolo-signaling}
        volumes:
            - .:/app

    web:
        build:
            context: .
            target: dev
            secrets:
                - npm_token
        image: tolo-web-dev
        ports:
            - "3000:3000"
        environment:
            NODE_ENV: development
            NEXT_TELEMETRY_DISABLED: "1"
            WATCHPACK_POLLING: "true"
            NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${FIRESTORE_PROJECT_ID:-tolo-signaling}
            NEXT_PUBLIC_FIRESTORE_EMULATOR_HOST: localhost:8080
        depends_on:
            - firebase
        develop:
            watch:
                - action: sync
                  path: .
                  target: /app
                  ignore:
                      - node_modules/
                      - .next/
                      - .git/
                      - .env
                - action: rebuild
                  path: package.json
                - action: rebuild
                  path: pnpm-lock.yaml

secrets:
    npm_token:
        environment: NPM_TOKEN
