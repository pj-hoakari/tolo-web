services:
  esp-tunnel-proxy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    volumes:
      - type: bind
        source: ./tunnel/Caddyfile.esp
        target: /etc/caddy/Caddyfile
        read_only: true
    depends_on:
      - firebase-emulator

  # ESP 用: Firestore と Auth を1つのドメインにまとめる（メール認証なし）
  esp-emulator-tunnel:
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    command: tunnel --protocol http2 --url http://esp-tunnel-proxy:8080
    depends_on:
      - esp-tunnel-proxy

  # ESP 用: edge-bridge のシグナリング
  esp-edge-tunnel:
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    command: tunnel --protocol http2 --url http://tolo-edge-bridge:8787
    depends_on:
      - tolo-edge-bridge
